# Iceberg tables, catalog in Nessie, data on S3 (Silo)
connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
iceberg.nessie-catalog.ref=main
iceberg.nessie-catalog.default-warehouse-dir=s3://warehouse/

# Native S3 file system (older Trino releases call this fs.native-s3.enabled)
fs.s3.enabled=true
s3.endpoint=http://silo:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=password

# LAB ONLY: let us expire snapshots and remove orphans right now.
# Production default is 7d. Never set 0s on real data.
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s

# Rotten Lakehouse: a "normal company" lakehouse that rots in real time.
#
#   shop (Postgres)  --app writes orders & payments every second-->
#   loader            --every 10s: INSERT INTO lakehouse SELECT new rows FROM shop (via Trino)-->
#   Iceberg tables on S3 (Silo), catalog in Nessie, queried with Trino.
#
# Nessie settings follow projectnessie/nessie docker/all-in-one.

x-python-env: &python-env
  SHOP_DSN: postgresql://postgres:postgres@postgres:5432/shop
  TRINO_HOST: trino
  TRINO_PORT: "8080"
  S3_ENDPOINT: http://silo:9000
  S3_KEY: admin
  S3_SECRET: password

services:
  # ---------- The company's app database (OLTP) + Nessie's own store ----------
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./init/postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"   # 5433 on your laptop, so it won't clash with a local Postgres

  # ---------- Object storage (S3-compatible) ----------
  silo:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console: watch the bucket fill up

  create-bucket:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://silo:9000 admin password && mc mb --ignore-existing local/warehouse"
    restart: "no"

  # ---------- Catalog ----------
  nessie:
    image: ghcr.io/projectnessie/nessie:0.110.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - nessie.version.store.type=JDBC2
      - nessie.version.store.persist.jdbc.datasource=postgresql
      - quarkus.datasource.postgresql.jdbc.url=jdbc:postgresql://postgres:5432/nessie
      - quarkus.datasource.postgresql.username=postgres
      - quarkus.datasource.postgresql.password=postgres
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /q/health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 5s
      timeout: 2s
      retries: 30
    ports:
      - "19120:19120"  # Nessie API + UI at http://localhost:19120

  # ---------- Query engine ----------
  trino:
    image: trinodb/trino:latest
    depends_on:
      nessie:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "trino --execute 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 40
    ports:
      - "8080:8080"   # Trino UI: watch query times and splits

  # ---------- The company: an app that keeps selling things ----------
  shop:
    image: python:3.12-slim
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *python-env
      ORDERS_PER_SECOND: "8"
    volumes:
      - ./app:/app:ro
    working_dir: /app
    command: sh -c "pip install -q --root-user-action=ignore -r requirements.txt && python -u shop.py"

  # ---------- The data team's pipeline: small, frequent loads ----------
  loader:
    image: python:3.12-slim
    depends_on:
      trino:
        condition: service_healthy
    environment:
      <<: *python-env
      LOAD_EVERY_SECONDS: "10"
    volumes:
      - ./app:/app:ro
    working_dir: /app
    command: sh -c "pip install -q --root-user-action=ignore -r requirements.txt && python -u loader.py"

# The lakehouse: Iceberg tables, catalog in Nessie, files on S3.
# The ${ENV:...} values come from your .env file.

connector.name=iceberg
iceberg.catalog.type=nessie
iceberg.nessie-catalog.uri=http://nessie:19120/api/v2
iceberg.nessie-catalog.ref=main
iceberg.nessie-catalog.default-warehouse-dir=s3://${ENV:S3_BUCKET}/rotten-lakehouse/

fs.s3.enabled=true
s3.region=${ENV:AWS_REGION}
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}

# DEMO ONLY: allows cleaning up old versions right away (see solutions/).
# The safe default is 7 days. Never use 0s on real company data.
iceberg.expire-snapshots.min-retention=0s
iceberg.remove-orphan-files.min-retention=0s
